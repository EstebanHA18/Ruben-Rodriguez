<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131C"/>
      <stop offset="50%" stop-color="#090A0F"/>
      <stop offset="100%" stop-color="#040507"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="75%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#7928CA" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silhouetteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A2C38"/>
      <stop offset="100%" stop-color="#111319"/>
    </linearGradient>
    <linearGradient id="accentStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#00E676"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)"/>
  <rect width="800" height="1000" fill="url(#glowCyan)"/>
  <rect width="800" height="1000" fill="url(#glowPurple)"/>

  <!-- Decorative Tech Grid Lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="800" x2="800" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="1000"/>
    <line x1="400" y1="0" x2="400" y2="1000"/>
    <line x1="600" y1="0" x2="600" y2="1000"/>
  </g>

  <!-- Glowing Ring Backdrop -->
  <circle cx="400" cy="450" r="260" fill="none" stroke="url(#accentStroke)" stroke-width="2" opacity="0.4" stroke-dasharray="8 12"/>
  <circle cx="400" cy="450" r="280" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Stylized Figure / Silhouette -->
  <g transform="translate(0, 50)">
    <!-- Head -->
    <ellipse cx="400" cy="350" rx="100" ry="125" fill="url(#silhouetteGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <!-- Modern Hair Silhouette -->
    <path d="M 310 320 C 310 230, 490 230, 490 320 C 490 270, 450 240, 400 240 C 350 240, 310 270, 310 320 Z" fill="#3D4050"/>
    <!-- Shoulders & Torso -->
    <path d="M 230 540 C 230 460, 300 450, 400 450 C 500 450, 570 460, 570 540 L 620 900 C 620 930, 180 930, 180 900 Z" fill="url(#silhouetteGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <!-- Collar Detail -->
    <path d="M 360 480 L 400 550 L 440 480" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <!-- Microphone / Soundwave badge -->
    <circle cx="400" cy="620" r="42" fill="#141721" stroke="url(#accentStroke)" stroke-width="2"/>
    <!-- Mic icon in center -->
    <path d="M 395 605 C 392 605, 390 607, 390 610 L 390 622 C 390 625, 392 627, 395 627 C 398 627, 400 625, 400 622 L 400 610 C 400 607, 398 605, 395 605 Z" fill="#00F2FE" transform="translate(5, 0)"/>
    <path d="M 386 618 C 386 626, 414 626, 414 618" fill="none" stroke="#00F2FE" stroke-width="2" stroke-linecap="round"/>
    <line x1="400" y1="627" x2="400" y2="635" stroke="#00F2FE" stroke-width="2"/>
  </g>

  <!-- Elegant Bottom Overlay Badge -->
  <g transform="translate(180, 830)">
    <rect width="440" height="74" rx="37" fill="rgba(18, 20, 29, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <circle cx="45" cy="37" r="14" fill="#00E676" opacity="0.2"/>
    <circle cx="45" cy="37" r="6" fill="#00E676"/>
    <text x="75" y="34" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" letter-spacing="1">RUBÉN RODRÍGUEZ</text>
    <text x="75" y="52" fill="rgba(255,255,255,0.6)" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Foto Oficial / Reemplazable con ruben.jpg</text>
  </g>
</svg>
